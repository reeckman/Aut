name: 删除所有 Anynines 应用

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: '请输入 "确认删除" 以确认操作'
        required: true
        type: string
      EMAIL:
        description: 'Anynines 邮箱'
        required: true
        type: string
      PASSWORD:
        description: 'Anynines 密码'
        required: true
        type: string

jobs:
  delete-apps:
    runs-on: ubuntu-latest
    name: Delete Apps

    steps:
      - name: 验证确认短语
        run: |
          if [ "${{ inputs.confirmation }}" != "确认删除" ]; then
            echo "错误：必须输入 '确认删除' 来确认操作"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install CF CLI
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
          echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update
          sudo apt-get install -y cf8-cli

      - name: Login to Cloud Foundry
        env:
          CF_EMAIL: ${{ inputs.EMAIL }}
          CF_PASSWORD: ${{ inputs.PASSWORD }}
        run: |
          set -e

          echo "登录 Cloud Foundry..."

          cf login \
            -a "https://api.de.a9s.eu" \
            -u "$CF_EMAIL" \
            -p "$CF_PASSWORD"

          echo
          echo "当前用户:"
          cf whoami

          echo
          echo "可用组织:"
          cf orgs

          echo
          echo "可用空间:"
          cf spaces

      - name: 选择目标 ORG / SPACE
        run: |
          set -e

          # 如果你的账号只有一个 ORG 和一个 SPACE，
          # 可以使用下面的方式获取。
          ORG=$(cf orgs | awk 'NF && $1 != "Getting" && $1 != "OK" && $1 != "name" {print $1; exit}')
          SPACE=$(cf spaces | awk 'NF && $1 != "Getting" && $1 != "OK" && $1 != "name" {print $1; exit}')

          if [ -z "$ORG" ]; then
            echo "错误：没有找到 ORG"
            exit 1
          fi

          if [ -z "$SPACE" ]; then
            echo "错误：没有找到 SPACE"
            exit 1
          fi

          echo "ORG=$ORG" >> "$GITHUB_ENV"
          echo "SPACE=$SPACE" >> "$GITHUB_ENV"

          echo "选择的 ORG: $ORG"
          echo "选择的 SPACE: $SPACE"

          cf target -o "$ORG" -s "$SPACE"

      - name: 检查当前权限
        run: |
          set -e

          echo "========================================"
          echo "当前用户"
          echo "========================================"
          cf whoami

          echo
          echo "========================================"
          echo "当前 Target"
          echo "========================================"
          cf target

          echo
          echo "========================================"
          echo "当前 Space 用户/角色"
          echo "========================================"
          cf space-users "$ORG" "$SPACE" || true

          echo
          echo "========================================"
          echo "当前应用"
          echo "========================================"
          cf apps

      - name: 获取所有应用
        id: get-apps
        run: |
          set -e

          apps=$(cf apps | awk '
            NR > 3 && $1 != "" && $1 != "No" {
              print $1
            }
          ')

          echo "发现的应用:"
          echo "$apps"

          if [ -z "$apps" ]; then
            echo "没有发现应用"
            echo "has_apps=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_apps=true" >> "$GITHUB_OUTPUT"

          {
            echo "apps<<EOF"
            echo "$apps"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 删除所有应用
        if: steps.get-apps.outputs.has_apps == 'true'
        run: |
          set -e

          apps="${{ steps.get-apps.outputs.apps }}"

          echo "========================================"
          echo "准备删除以下应用:"
          echo "$apps"
          echo "========================================"

          for app in $apps; do
            echo
            echo "正在删除应用: $app"

            if cf delete -f -r "$app"; then
              echo "应用 $app 删除成功"
            else
              echo "========================================"
              echo "错误：应用 $app 删除失败"
              echo "请检查当前用户是否具有 Space Developer 权限"
              echo "========================================"
              exit 1
            fi

            echo "----------------------------------------"
            sleep 10
          done

      - name: 验证应用已删除
        run: |
          echo "========================================"
          echo "剩余的应用:"
          echo "========================================"

          cf apps
